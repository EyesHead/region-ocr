name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-installer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and JavaScript sources
        shell: pwsh
        run: |
          @'
          import ast
          from pathlib import Path
          for path in [*Path('.').glob('*.py'), *Path('local_web').glob('*.py'), *Path('installer').glob('*.py')]:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print('Python syntax OK')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Python validation failed' }
          node --check local_web/web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript validation failed' }
      - name: Build and verify installer
        shell: pwsh
        run: |
          python -B installer/build.py --output release
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*
          retention-days: 7
      - name: Publish release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content installer/install-plan.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite it" }
          $notes = "Исправлены сбои экспорта PDF при повреждённом ответе OCR для ячейки таблицы. Конвертер сверяет сетку, вертикальный текст и размерные подписи с исходной страницей, сохраняет формулы и объединения ячеек. Неоднозначные области доступны для визуальной сверки."
          gh release create $tag "release/REGION-OCR-$version-Setup.exe" release/SHA256SUMS --target $env:GITHUB_SHA --title "REGION OCR $version" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
